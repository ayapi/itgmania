<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITGmania 配信情報</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font-family:"Yu Gothic UI","Meiryo",sans-serif}
[hidden]{display:none!important}
main{padding:20px 24px;background:rgba(15,15,20,.86);border-radius:16px}
header{display:flex;gap:30px;align-items:center}
.tempo{flex:none;min-width:170px}.caption{font-size:20px;color:#ddd}.bpm{font-size:56px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.song{min-width:0}h1{margin:0;font-size:32px;line-height:1.3;overflow-wrap:anywhere}.artist{margin-top:6px;font-size:24px;color:#ddd;overflow-wrap:anywhere}
.effects-heading{margin:16px 0 8px;font-size:20px;color:#ddd}
ul{padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px;list-style:none}
li{display:flex;gap:12px;align-items:center;padding:8px 12px;background:rgba(255,255,255,.12);border-radius:8px;font-size:23px}
.sender{overflow-wrap:anywhere}.delta{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}.positive{color:#ffda72}.negative{color:#82dfff}.remaining{font-size:18px;color:#ccc;white-space:nowrap}
.empty{font-size:22px;color:#ccc}
</style>
<main id="panel" hidden>
 <header><div class="tempo"><div class="caption">現在のBPM</div><div class="bpm" id="bpm">—</div></div>
 <div class="song"><h1 id="title"></h1><div class="artist" id="artist"></div></div></header>
 <div class="effects-heading">適用中のBPMギフト</div>
 <ul id="effects"></ul><div class="empty" id="empty">なし</div>
</main>
<script>
'use strict';
const panel=document.getElementById('panel');
const number=value=>new Intl.NumberFormat('ja-JP',{maximumFractionDigits:1}).format(value);
function render(status){
 panel.hidden=!(status.ready && status.connected!==false);
 if(panel.hidden)return;
 document.getElementById('bpm').textContent=Number.isFinite(status.effective_bpm)?number(status.effective_bpm):'—';
 document.getElementById('title').textContent=status.song_title||status.song||'';
 document.getElementById('artist').textContent=status.song_artist||'';
 const effects=Array.isArray(status.active_tempo_effects)?status.active_tempo_effects:[];
 const list=document.getElementById('effects');
 const rows=effects.map(effect=>{
  const row=document.createElement('li');
  const name=document.createElement('span');name.className='sender';name.textContent=effect.sender||'名前なし';
  const delta=document.createElement('span');const value=Number(effect.bpm_delta)||0;
  delta.className='delta '+(value>=0?'positive':'negative');delta.textContent=(value>=0?'+':'')+number(value)+' BPM';
  const remaining=document.createElement('span');remaining.className='remaining';remaining.textContent='残り'+Math.ceil(Math.max(0,Number(effect.remaining_seconds)||0))+'秒';
  row.append(name,delta,remaining);return row;
 });
 list.replaceChildren(...rows);document.getElementById('empty').hidden=rows.length>0;
}
async function poll(){
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),2000);
 try{const response=await fetch('/api/status',{cache:'no-store',signal:controller.signal});
  if(!response.ok)throw new Error('status');render(await response.json());
 }catch{panel.hidden=true;}finally{clearTimeout(timeout);setTimeout(poll,250);}
}
poll();
</script>
</html>
