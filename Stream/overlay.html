<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITGmania 配信情報</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
/* BEGIN LOCAL BEAST FONT */
/* END LOCAL BEAST FONT */
:root{--bpm-x:540px;--bpm-bottom:1021px}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:"Noto Color Emoji","Noto Sans JP",sans-serif;font-weight:700}
[hidden]{display:none!important}
#trial-wash{position:fixed;inset:0;background:#ff871a;opacity:0;pointer-events:none;will-change:opacity;z-index:0}
body:not(.light-only) #trial-wash{display:none}
body.light-only{width:100vw;height:100vh;background:#000}
body.light-only #trial-wash{background:#000;opacity:1;will-change:background-color}
body.light-only main{display:none!important}
main{z-index:1;position:relative;width:1080px;height:1920px}
.song{position:absolute;left:40px;top:135px;width:490px;color:white;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 2px 0 #000,-2px 0 0 #000,2px 0 0 #000,0 -2px 0 #000}
h1{margin:0;font-size:40px;line-height:1.25;font-weight:700;overflow-wrap:anywhere}.artist{margin-top:6px;font-size:32px;line-height:1.3;overflow-wrap:anywhere}
.effects{position:absolute;left:var(--bpm-x);bottom:calc(1920px - var(--bpm-bottom) + 68px + var(--lock-space,0px));transform:translateX(-50%);width:470px}
ul{padding:0;margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;list-style:none}
li{display:flex;align-items:center;gap:12px;max-width:470px;padding:0;color:#fff;font-size:34px;line-height:1.2}
.sender{min-width:0;max-width:330px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 2px 3px #000,2px 0 2px #000,-2px 0 2px #000,0 -2px 2px #000}
.delta{flex:none;font-family:"Beast Machines",monospace;font-weight:400;line-height:1.15;letter-spacing:3px;white-space:nowrap;font-variant-numeric:tabular-nums;color:#fff;-webkit-text-stroke:1.4px var(--delta-color);paint-order:stroke fill;text-shadow:0 0 5px var(--delta-color)}.positive{--delta-color:#ff4040}.negative{--delta-color:#39d638}
.menu{position:absolute;top:255px;width:245px;color:#fff;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;font-family:"Noto Sans JP","Noto Color Emoji",sans-serif;font-size:18px;line-height:1.2}
.note-menu{left:24px}.tempo-menu{right:24px}.menu h2{font-size:23px;margin:0 0 4px}.price{font-size:16px}.stock{font-size:24px;margin-top:4px}.sold{color:#ffdc00}
.rules{margin-top:4px;font-size:13px;line-height:1.3;white-space:pre-line;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.receipt{font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge{height:16px;margin:7px 0;border:2px solid white;background:#2229;border-radius:3px;overflow:hidden}.gauge>div{height:100%;background:#ffc74b;width:0;transition:width 140ms linear}
.trial-center{font-family:"Noto Sans JP","Noto Color Emoji",sans-serif;position:absolute;left:var(--bpm-x);top:calc(var(--bpm-bottom) + 36px);transform:translateX(-50%);width:660px;text-align:center;color:white;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 2px 0 #000,0 -2px 0 #000}
#trial-info{font-size:48px;line-height:1.12;color:#ffbb57;font-weight:700;white-space:nowrap}#trial-panel.strong #trial-info{font-size:64px;color:#ff6e40;text-shadow:3px 3px 0 #230900,-3px -3px 0 #230900,3px -3px 0 #230900,-3px 3px 0 #230900}
#trial-sender{font-size:36px;line-height:1.2;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
#trial-panel.announcing #trial-info{color:#ffe6a1;font-size:54px}
.trial-center.announcing #trial-phase{font-size:34px;color:#ffe6a1;min-height:0}
#trial-panel.counting #trial-info{font-size:124px;line-height:1;color:#fff2c2}
.trial-center.counting #trial-phase{font-size:28px}
.trial-center.clearing #trial-info{font-size:58px;color:#b7fff2;text-shadow:2px 2px 0 #07352e,-2px -2px 0 #07352e,2px -2px 0 #07352e,-2px 2px 0 #07352e,0 0 16px #53ffe699}
.trial-center.clearing #trial-phase{display:none}
#next-trial{font-size:18px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ffe6a1}
#trial-phase{font-size:22px;line-height:1.2;min-height:27px;margin-top:3px;color:#ffe5a1}
.trial-center .gauge{height:26px;margin:7px 0 4px;background:#191919b3;border-width:3px}.trial-center #remaining{font-size:32px;line-height:1.15}.trial-center.strong .gauge>div{background:#ff8647}
#bank-status{font-size:18px}#effects li{font-size:20px;line-height:1.25;width:245px;max-width:245px}#effects .sender{max-width:185px}#effects .delta{font-family:inherit;font-size:20px;letter-spacing:0;-webkit-text-stroke:0;text-shadow:inherit}
#result{margin-top:7px;color:#ffe69b}.gift-choice{display:flex;gap:4px;align-items:center;font-size:16px}.gift-choice img{width:24px;height:24px;object-fit:contain}
</style>
<div id="trial-wash" aria-hidden="true"></div>
<main id="panel" hidden>
 <section class="song"><h1 id="title"></h1><div class="artist" id="artist"></div></section>
 <section class="menu note-menu"><h2>NOTE ATTACK</h2><div class="receipt" id="receipt">100円相当 / 1ノート</div><div class="stock" id="note-stock"></div><div class="rules" id="rules"></div></section>
 <section class="menu tempo-menu"><h2>RESCUE / CHALLENGE / LOCK</h2>
  <div id="rank"></div><div class="price">ハート20回＝1pt / 1コイン・ジュエル＝1pt</div>
  <div id="trial-stock"></div><div id="lock-stock"></div>
  <div id="next-trial"></div>
  <div id="bank-status"></div>
  <div id="gift-menu"></div><ul id="effects"></ul><div id="result"></div>
 </section>
 <section class="trial-center" id="trial-panel" hidden aria-live="polite">
  <div id="trial-info"></div><div id="trial-sender"></div><div id="trial-phase"></div>
  <div id="rescue"><div class="gauge"><div id="progress"></div></div><div id="remaining"></div></div>
 </section>
</main>
<script>
'use strict';
const panel=document.getElementById('panel'),list=document.getElementById('effects');
const rows=new Map();let session;
let receiptId;
const number=value=>new Intl.NumberFormat('ja-JP',{maximumFractionDigits:1,useGrouping:false}).format(value);
const params=new URLSearchParams(location.search);
// OBS composites this dedicated source with SCREEN. Black contributes no
// light; changing RGB brightness controls blend strength without alpha fades.
const lightOnly=params.get('mode')==='light';
document.body.classList.toggle('light-only',lightOnly);
for(const [key,css] of [['bpmX','--bpm-x'],['bpmBottom','--bpm-bottom']]){
 const value=Number(params.get(key));if(params.has(key)&&Number.isFinite(value))document.documentElement.style.setProperty(css,value+'px');
}
// BPM clock: interpolate locally between snapshots instead of stepping at
// the HTTP polling rate. No audio/microphone stream is needed.
function trialPulseOpacity(beat,bpm){
 const skip=Math.max(1,Math.ceil(bpm/180));
 const phase=((beat/skip)%1+1)%1;
 return 0.12+0.38*(1+Math.cos(phase*2*Math.PI))/2;
}
const wash=document.getElementById('trial-wash');
let pulseClock=null;
function setPulseStrength(strength){
 if(lightOnly){
  wash.style.opacity='1';
  wash.style.backgroundColor=`rgb(${Math.round(255*strength)},${Math.round(135*strength)},${Math.round(26*strength)})`;
 }else wash.style.opacity='0';
}
function clearPulse(){pulseClock=null;setPulseStrength(0);}
function syncPulse(status,networkSeconds=0){
 if(status.protocol_version!==5||!status.ready||status.connected===false||!status.trial_state?.trial){clearPulse();return;}
 const bpm=Number(status.effective_bpm),beat=Number(status.song_beat);
 if(!Number.isFinite(bpm)||bpm<=0||!Number.isFinite(beat)){clearPulse();return;}
 const age=Math.min(0.5,Math.max(0,Number(status.snapshot_age_seconds)||0)+networkSeconds);
 pulseClock={beat:beat+age*bpm/60,bpm,at:performance.now()};
}
function animatePulse(now){
 if(pulseClock){
  const elapsed=(now-pulseClock.at)/1000;
  if(elapsed>1.5)clearPulse();
  else setPulseStrength(trialPulseOpacity(pulseClock.beat+elapsed*pulseClock.bpm/60,pulseClock.bpm));
 }
 requestAnimationFrame(animatePulse);
}
requestAnimationFrame(animatePulse);
// Derive the cue from the musical clock, including the last measure's beats.
function challengePresentation(st,beat){
 const r=st.resolution,a=st.announcement,t=st.trial;
 if(r?.resolved && beat<r.end_beat){
  const phase=Math.max(0,(beat-r.beat)/(r.end_beat-r.beat));
  return {mode:'clearing',title:'CHALLENGE CLEAR!',phase:'',sender:'',strong:false,
   scale:1+0.08*Math.exp(-phase*16),alpha:Math.min(1,(1-phase)*5)};
 }
 if(a){
  const title=a.kind==='strong'?'CHALLENGE ATTACK':'CHALLENGE';
  if(beat>=a.final_measure_beat){
   return {mode:'counting',title:beat>=a.start_beat?'START!':String(Math.max(1,Math.ceil(a.start_beat-beat-1e-6))),
    phase:title,sender:a.sender||'',strong:a.kind==='strong',
    scale:1+0.08*Math.exp(-(beat-Math.floor(beat))*14),alpha:1};
  }
  const measures=a.measure_boundaries?.filter(b=>b>beat+1e-6).length||a.remaining_measures;
  return {mode:'announcing',title,phase:'開始まで'+measures+'小節',sender:a.sender||'',strong:a.kind==='strong',scale:1,alpha:1};
 }
 if(t)return {mode:'active',title:t.kind==='strong'?'強い試練 ＋'+t.rise:'CHALLENGE ＋'+t.rise,
  phase:!t.hearts_enabled?'ハート無効中 / 救済ギフト・ロックは有効':'',sender:t.kind==='strong'?t.sender:'',strong:t.kind==='strong',scale:1,alpha:1};
 return null;
}
let cueClock=null;
function syncChallenge(status,networkSeconds){
 if(status.native_trial_panel){cueClock=null;document.getElementById('trial-panel').hidden=true;return;}
 if(status.protocol_version!==5||!status.ready||status.connected===false){cueClock=null;return;}
 const bpm=Number(status.effective_bpm),beat=Number(status.song_beat);
 if(!Number.isFinite(bpm)||bpm<=0||!Number.isFinite(beat)){cueClock=null;return;}
 const age=Math.min(.5,Math.max(0,Number(status.snapshot_age_seconds)||0)+networkSeconds);
 cueClock={st:status.trial_state||{},beat:beat+age*bpm/60,bpm,at:performance.now()};
}
function drawChallenge(st,beat){
 const cue=challengePresentation(st,beat),central=document.getElementById('trial-panel');
 central.hidden=!cue;
 for(const mode of ['announcing','counting','clearing'])central.classList.toggle(mode,cue?.mode===mode);
 central.classList.toggle('strong',!!cue?.strong);
 const title=document.getElementById('trial-info');title.textContent=cue?.title||'';
 title.style.transform=`scale(${cue?.scale||1})`;title.style.opacity=String(cue?.alpha??1);
 const sender=document.getElementById('trial-sender');sender.hidden=!cue?.sender;sender.textContent=cue?.sender||'';
 document.getElementById('trial-phase').textContent=cue?.phase||'';
 document.getElementById('rescue').hidden=cue?.mode!=='active';
}
function render(status,networkSeconds=0){
 syncPulse(status,networkSeconds);
 syncChallenge(status,networkSeconds);
 const st=status.trial_state||{};
 panel.hidden=status.protocol_version!==5 || !(status.connected!==false && (status.ready || ((st.trial_results||[]).length && status.reason==='Gameplay ended')));
 if(panel.hidden){list.replaceChildren();rows.clear();return;}
 if(session!==status.session){list.replaceChildren();rows.clear();session=status.session;}
 const title=status.song_title||status.song||'';
 document.getElementById('title').textContent=title?'♪ '+title:'';
 document.getElementById('artist').textContent=status.song_artist||'';
 const count=Number(status.note_remaining)||0;
 const stock=document.getElementById('note-stock');stock.textContent=count?'残り '+count+'枠':'SOLD OUT';stock.classList.toggle('sold',!count);
 document.getElementById('rank').textContent='ランク '+(st.rank||1)+' / 同接 '+(st.viewers||0)+'人';
 const required=st.required_units||1;
 document.getElementById('trial-stock').textContent='CHALLENGE '+(st.trial_units||0)+'/'+required+'個'+(st.trial_reserved?' / 予約'+st.trial_reserved+'回':'');
 const lock=document.getElementById('lock-stock');lock.textContent=st.lock_remaining?'LOCK '+(st.lock_units||0)+'/'+required+'個・残り'+st.lock_remaining+'回':'LOCK SOLD OUT'+(st.lock_units?' / 持越し'+st.lock_units+'個':'');
 const t=st.trial;
 if(!status.native_trial_panel)drawChallenge(st,status.song_beat);
 document.getElementById('next-trial').textContent=status.bpm_lock&&st.next_trial_sender?'NEXT: '+st.next_trial_sender+'のCHALLENGE':'';
 document.getElementById('bank-status').textContent=st.rescue_bank?'救済持越し '+number(st.rescue_bank)+'pt':'';
 document.getElementById('progress').style.width=t?Math.min(100,100*t.points/t.required_points)+'%':'0%';
 document.getElementById('remaining').textContent=t?'残り '+number(t.remaining_points)+'pt'+(t.heart_pending?' / ハート反映待ち '+number(t.heart_pending)+'pt':''):'';
 document.getElementById('rules').textContent='試練で最大＋'+(status.bpm_offset_limit||0)+'BPM\nハートと救済ギフトで原曲へ';
 const note=(status.note_feed||[]).slice(-1)[0],receipt=document.getElementById('receipt');
 receipt.textContent=note?(note.count+'ノート受付：'+note.sender):'100円相当 / 1ノート';
 if(note && receiptId!==note.event_id){receiptId=note.event_id;receipt.animate([{transform:'translateY(12px)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:160,easing:'ease-out'});}
 const results=st.trial_results||[];
 document.getElementById('result').textContent=results.length?'CHALLENGE '+results.filter(r=>r.resolved).length+'/'+results.length+' CLEAR':'';
 const effects=(st.rescue_feed||[]).slice(-3),alive=new Set();
 for(const effect of effects){
  const id=effect.event_id;alive.add(id);let row=rows.get(id);
  if(!row){row=document.createElement('li');row.append(document.createElement('span'),document.createElement('span'));row.children[0].className='sender';row.children[1].className='delta';rows.set(id,row);list.append(row);row.animate([{transform:'translateY(12px)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:150,easing:'ease-out'});}
  row.children[0].textContent=effect.sender;row.children[1].textContent='+'+number(effect.points/(effect.count||1))+'pt'+(effect.count>1?' ×'+effect.count:'');
 }
 for(const [id,row] of rows)if(!alive.has(id)){row.remove();rows.delete(id);}
 const menu=document.getElementById('gift-menu'),choices=status.gift_menu||[],key=JSON.stringify(choices);
 if(menu.dataset.key!==key){menu.dataset.key=key;menu.replaceChildren();for(const gift of choices){const row=document.createElement('div');row.className='gift-choice';if(gift.image_url){const img=document.createElement('img');img.src=gift.image_url;row.append(img);}const label=document.createElement('span');label.textContent=gift.platform+' '+gift.name+' / '+gift.cost+' '+(gift.platform==='youtube'?'ジュエル':'コイン');row.append(label);menu.append(row);}}
}
function animateChallenge(now){
 if(cueClock){
  const elapsed=(now-cueClock.at)/1000;
  if(elapsed>1.5){cueClock=null;document.getElementById('trial-panel').hidden=true;}
  else drawChallenge(cueClock.st,cueClock.beat+elapsed*cueClock.bpm/60);
 }
 requestAnimationFrame(animateChallenge);
}
requestAnimationFrame(animateChallenge);
async function poll(){
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),2000);
 const sentAt=performance.now();
 try{const response=await fetch('/api/status',{cache:'no-store',signal:controller.signal});
  if(!response.ok)throw new Error('status');const status=await response.json();render(status,(performance.now()-sentAt)/2000);
 }catch{clearPulse();cueClock=null;panel.hidden=true;list.replaceChildren();rows.clear();}finally{clearTimeout(timeout);setTimeout(poll,250);}
}
poll();
</script>
</html>
