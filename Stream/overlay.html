<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITGmania 配信情報</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
/* BEGIN LOCAL BEAST FONT */
/* END LOCAL BEAST FONT */
:root{--bpm-x:540px;--bpm-bottom:717px}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:"Noto Color Emoji","Noto Sans JP",sans-serif;font-weight:700}
[hidden]{display:none!important}
main{position:relative;width:1080px;height:1920px}
.song{position:absolute;left:40px;top:135px;width:490px;color:white;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 2px 0 #000,-2px 0 0 #000,2px 0 0 #000,0 -2px 0 #000}
h1{margin:0;font-size:40px;line-height:1.25;font-weight:700;overflow-wrap:anywhere}.artist{margin-top:6px;font-size:32px;line-height:1.3;overflow-wrap:anywhere}
.effects{position:absolute;left:var(--bpm-x);bottom:calc(1920px - var(--bpm-bottom) + 68px + var(--lock-space,0px));transform:translateX(-50%);width:470px}
ul{padding:0;margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;list-style:none}
li{display:flex;align-items:center;gap:12px;max-width:470px;padding:0;color:#fff;font-size:34px;line-height:1.2}
.sender{min-width:0;max-width:330px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 2px 3px #000,2px 0 2px #000,-2px 0 2px #000,0 -2px 2px #000}
.delta{flex:none;font-family:"Beast Machines",monospace;font-weight:400;line-height:1.15;letter-spacing:3px;white-space:nowrap;font-variant-numeric:tabular-nums;color:#fff;-webkit-text-stroke:1.4px var(--delta-color);paint-order:stroke fill;text-shadow:0 0 5px var(--delta-color)}.positive{--delta-color:#ff4040}.negative{--delta-color:#39d638}
.menu{position:absolute;top:255px;width:245px;color:#fff;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;font-family:"Noto Sans JP","Noto Color Emoji",sans-serif;font-size:18px;line-height:1.2}
.note-menu{left:24px}.tempo-menu{right:24px}.menu h2{font-size:23px;margin:0 0 4px}.price{font-size:16px}.stock{font-size:24px;margin-top:4px}.sold{color:#ffdc00}
.rules{margin-top:4px;font-size:13px;line-height:1.3;white-space:pre-line;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.receipt{font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge{height:16px;margin:7px 0;border:2px solid white;background:#2229;border-radius:3px;overflow:hidden}.gauge>div{height:100%;background:#ffc74b;width:0;transition:width 140ms linear}
#trial-info.strong{font-size:26px;line-height:1.15}#trial-info{margin-top:8px;color:#ffbc64;overflow-wrap:anywhere}#effects li{font-size:20px;line-height:1.25;width:245px;max-width:245px}#effects .sender{max-width:185px}#effects .delta{font-family:inherit;font-size:20px;letter-spacing:0;-webkit-text-stroke:0;text-shadow:inherit}
#result{margin-top:7px;color:#ffe69b}.gift-choice{display:flex;gap:4px;align-items:center;font-size:16px}.gift-choice img{width:24px;height:24px;object-fit:contain}
</style>
<main id="panel" hidden>
 <section class="song"><h1 id="title"></h1><div class="artist" id="artist"></div></section>
 <section class="menu note-menu"><h2>NOTE ATTACK</h2><div class="receipt" id="receipt">100円相当 / 1ノート</div><div class="stock" id="note-stock"></div><div class="rules" id="rules"></div></section>
 <section class="menu tempo-menu"><h2>RESCUE / TRIAL / LOCK</h2>
  <div id="rank"></div><div class="price">ハート20回＝1pt / 1コイン・ジュエル＝1pt</div>
  <div id="trial-stock"></div><div id="lock-stock"></div>
  <div id="trial-info"></div><div id="rescue" hidden><div class="gauge"><div id="progress"></div></div><div id="remaining"></div></div>
  <div id="gift-menu"></div><ul id="effects"></ul><div id="result"></div>
 </section>
</main>
<script>
'use strict';
const panel=document.getElementById('panel'),list=document.getElementById('effects');
const rows=new Map();let session;
let receiptId;
const number=value=>new Intl.NumberFormat('ja-JP',{maximumFractionDigits:1,useGrouping:false}).format(value);
const params=new URLSearchParams(location.search);
for(const [key,css] of [['bpmX','--bpm-x'],['bpmBottom','--bpm-bottom']]){
 const value=Number(params.get(key));if(params.has(key)&&Number.isFinite(value))document.documentElement.style.setProperty(css,value+'px');
}
function render(status){
 const st=status.trial_state||{};
 panel.hidden=status.protocol_version!==5 || !(status.connected!==false && (status.ready || ((st.trial_results||[]).length && status.reason==='Gameplay ended')));
 if(panel.hidden){list.replaceChildren();rows.clear();return;}
 if(session!==status.session){list.replaceChildren();rows.clear();session=status.session;}
 const title=status.song_title||status.song||'';
 document.getElementById('title').textContent=title?'♪ '+title:'';
 document.getElementById('artist').textContent=status.song_artist||'';
 const count=Number(status.note_remaining)||0;
 const stock=document.getElementById('note-stock');stock.textContent=count?'残り '+count+'枠':'SOLD OUT';stock.classList.toggle('sold',!count);
 document.getElementById('rank').textContent='ランク '+(st.rank||1)+' / 同接 '+(st.viewers||0)+'人';
 const required=st.required_units||1;
 document.getElementById('trial-stock').textContent='TRIAL '+(st.trial_units||0)+'/'+required+'個'+(st.trial_reserved?' / 予約'+st.trial_reserved+'回':'');
 const lock=document.getElementById('lock-stock');lock.textContent=st.lock_remaining?'LOCK '+(st.lock_units||0)+'/'+required+'個・残り'+st.lock_remaining+'回':'LOCK SOLD OUT'+(st.lock_units?' / 持越し'+st.lock_units+'個':'');
 const t=st.trial;
 document.getElementById("trial-info").classList.toggle("strong",t&&t.kind==="strong");
 document.getElementById('trial-info').textContent=t?(t.kind==='strong'?'強い試練：'+t.sender:'試練発生！')+(t.hearts_enabled?'':' / ハート待機中'):(st.rescue_bank?'救済ポイント持越し '+number(st.rescue_bank)+'pt':'');
 document.getElementById('rescue').hidden=!t;
 document.getElementById('progress').style.width=t?Math.min(100,100*t.points/t.required_points)+'%':'0%';
 document.getElementById('remaining').textContent=t?'残り '+number(t.remaining_points)+'pt'+(t.heart_pending?' / ハート反映待ち '+number(t.heart_pending)+'pt':''):'';
 document.getElementById('rules').textContent='試練で最大＋'+(status.bpm_offset_limit||0)+'BPM\nハートと救済ギフトで原曲へ';
 const note=(status.note_feed||[]).slice(-1)[0],receipt=document.getElementById('receipt');
 receipt.textContent=note?(note.count+'ノート受付：'+note.sender):'100円相当 / 1ノート';
 if(note && receiptId!==note.event_id){receiptId=note.event_id;receipt.animate([{transform:'translateY(12px)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:160,easing:'ease-out'});}
 const results=st.trial_results||[];
 document.getElementById('result').textContent=!status.ready&&results.length?'試練 '+results.filter(r=>r.resolved).length+'/'+results.length+'回解除':st.resolution&&st.resolution.resolved?'試練解除！':'';
 const effects=(st.rescue_feed||[]).slice(-3),alive=new Set();
 for(const effect of effects){
  const id=effect.event_id;alive.add(id);let row=rows.get(id);
  if(!row){row=document.createElement('li');row.append(document.createElement('span'),document.createElement('span'));row.children[0].className='sender';row.children[1].className='delta';rows.set(id,row);list.append(row);row.animate([{transform:'translateY(12px)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:150,easing:'ease-out'});}
  row.children[0].textContent=effect.sender;row.children[1].textContent='+'+number(effect.points/(effect.count||1))+'pt'+(effect.count>1?' ×'+effect.count:'');
 }
 for(const [id,row] of rows)if(!alive.has(id)){row.remove();rows.delete(id);}
 const menu=document.getElementById('gift-menu'),choices=status.gift_menu||[],key=JSON.stringify(choices);
 if(menu.dataset.key!==key){menu.dataset.key=key;menu.replaceChildren();for(const gift of choices){const row=document.createElement('div');row.className='gift-choice';if(gift.image_url){const img=document.createElement('img');img.src=gift.image_url;row.append(img);}const label=document.createElement('span');label.textContent=gift.platform+' '+gift.name+' / '+gift.cost+' '+(gift.platform==='youtube'?'ジュエル':'コイン');row.append(label);menu.append(row);}}
}

async function poll(){
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),2000);
 try{const response=await fetch('/api/status',{cache:'no-store',signal:controller.signal});
  if(!response.ok)throw new Error('status');render(await response.json());
 }catch{panel.hidden=true;list.replaceChildren();rows.clear();}finally{clearTimeout(timeout);setTimeout(poll,250);}
}
poll();
</script>
</html>
