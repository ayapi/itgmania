name: Stream Windows build

on:
  workflow_dispatch:
  push:
    branches: [release]
    paths:
      - 'src/**'
      - 'Stream/**'
      - '.github/workflows/stream-windows.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-env
        with:
          os: windows-2022
          ccache: 'false'
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DWITH_FULL_RELEASE=OFF -DWITH_CLUB_FANTASTIC=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v7
        with:
          name: ITGmania-stream-windows
          path: |
            Program/*.exe
            Program/*.dll
          if-no-files-found: error
